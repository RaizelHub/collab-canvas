<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pages validation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { BrowserRouter } from "react-router";
      import { WritingStudio } from "/src/features/pages/writing-studio.tsx";
      import { createManuscript } from "/src/features/pages/document-state.ts";
      import "/src/index.css";
      import * as repo from "/src/features/pages/repository.ts";
      import * as state from "/src/features/pages/document-state.ts";
      import * as Y from "yjs";
      window.validationTools = { repo, state, Y };
      const doc = createManuscript("thesis", "Export validation");
      window.validationDoc = doc;
      createRoot(document.getElementById("root")).render(
        React.createElement(
          BrowserRouter,
          null,
          React.createElement(WritingStudio, {
            doc,
            role: "owner",
            status: "In-memory test",
            local: true,
          }),
        ),
      );
    </script>
  </body>
</html>
